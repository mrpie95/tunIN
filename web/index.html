<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>tunIN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">tun<b>IN</b></div>
      <div class="seg tabs" id="tabs">
        <button data-view="tune" class="on">Tune</button><button data-view="explore">Explore</button>
      </div>
      <button id="start" class="start">Start listening</button>
    </header>

    <div class="layout">
      <!-- left: instrument, tuning family, slide -->
      <aside class="side">
        <h3>Instrument</h3>
        <nav class="list" id="instruments" aria-label="Instrument"></nav>

        <div class="tuning-block">
          <h3>Tuning</h3>
          <div id="tunings" aria-label="Tuning presets"></div>

          <h3>Slide <span class="off" id="offLabel">0 st</span></h3>
          <div class="tuning-name" id="tuningName"></div>
          <div class="slide">
            <canvas id="slideViz" aria-hidden="true"></canvas>
            <input type="range" id="offset" min="-1" max="1" step="0.0015" value="0" aria-label="Slide all strings">
            <div class="slide-btns">
              <button data-d="-1">−1</button><button data-d="-0.1">−.1</button>
              <button data-d="0.1">+.1</button><button data-d="1">+1</button>
            </div>
            <div class="slide-num">
              <input type="number" id="offNum" step="0.01" value="0" aria-label="Semitones">
              <span>semitones</span>
              <button id="offReset">Reset</button>
            </div>
          </div>
        </div>
      </aside>

      <div class="main">
        <div class="view-tune">
        <section class="neck" id="strings" aria-label="Strings"></section>
        <section class="string-buttons" id="buttons" aria-label="Choose string"></section>

        <section class="freq">
          <div class="readout">
            <div class="note" id="note">–</div>
            <div class="detail">
              <div id="hz" class="hz">0.0 Hz</div>
              <div id="cents" class="cents">listening…</div>
            </div>
          </div>
          <canvas id="meter" aria-hidden="true"></canvas>
          <label class="smooth">
            <span>Smoothing</span>
            <input type="range" id="smooth" min="0" max="1" step="0.05" value="0.4" aria-label="Smoothing">
            <b id="smoothLabel">Medium</b>
          </label>
          <div class="spec-head">
            <span>Spectrum</span>
            <div class="seg" id="view">
              <button data-v="full" class="on">Full</button><button data-v="focus">Focus</button><button data-v="lens" title="Zoomed on your target note; the further off, the more it compresses">Lens</button>
            </div>
          </div>
          <div class="spectrum"><canvas id="spectrum"></canvas></div>
        </section>
        </div>

        <div class="view-explore">
          <section class="panel">
            <div class="ex-row">
              <div class="seg" id="exMode"><button data-m="scale" class="on">Scale</button><button data-m="chord">Chord</button><button data-m="notes">Notes</button></div>
              <select id="exScale" aria-label="Scale"></select>
              <select id="exChord" aria-label="Chord"></select>
              <div class="seg" id="exAcc" title="Note names"><button data-a="sharp" class="on">♯</button><button data-a="flat">♭</button></div>
              <label class="chk"><input type="checkbox" id="exNat"> Naturals only</label>
              <div class="seg" id="exLabel" title="Dot labels"><button data-l="note" class="on">Notes</button><button data-l="interval">Intervals</button><button data-l="hz">Hz</button></div>
            </div>
            <div class="piano" id="piano" aria-label="Note picker"></div>
            <div class="ex-info" id="exInfo"></div>
          </section>
          <section class="panel">
            <div class="board-head">
              <span class="hint">Drag a string sideways to detune it · double-click to reset</span>
              <div class="shape-nav" id="shapeNav">
                <button id="shapePrev" aria-label="Previous shape">‹</button>
                <span id="shapeLabel"></span>
                <button id="shapeNext" aria-label="Next shape">›</button>
              </div>
              <button id="exReset" class="small">Reset strings</button>
            </div>
            <div class="board-wrap" id="boardWrap"><canvas id="board"></canvas></div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
  <script src="fretboard.js"></script>
  <script src="register-sw.js"></script>
</body>
</html>
