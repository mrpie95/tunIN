<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>tunIN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">tun<b>IN</b></div>
      <button id="start" class="start">Start listening</button>
    </header>

    <div class="layout">
      <!-- left: instrument, tuning family, slide -->
      <aside class="side">
        <h3>Instrument</h3>
        <nav class="list" id="instruments" aria-label="Instrument"></nav>

        <div class="tuning-block">
          <h3>Tuning</h3>
          <div id="tunings" aria-label="Tuning presets"></div>

          <h3>Slide <span class="off" id="offLabel">0 st</span></h3>
          <div class="slide">
            <input type="range" id="offset" min="-36" max="36" step="0.05" value="0" aria-label="Slide all strings">
            <div class="slide-btns">
              <button data-d="-1">−1</button><button data-d="-0.1">−.1</button>
              <button data-d="0.1">+.1</button><button data-d="1">+1</button>
            </div>
            <div class="slide-num">
              <input type="number" id="offNum" step="0.01" value="0" aria-label="Semitones">
              <span>semitones</span>
              <button id="offReset">Reset</button>
            </div>
          </div>
        </div>
      </aside>

      <div class="main">
        <section class="neck" id="strings" aria-label="Strings"></section>
        <section class="string-buttons" id="buttons" aria-label="Choose string"></section>

        <section class="freq">
          <div class="readout">
            <div class="note" id="note">–</div>
            <div class="detail">
              <div id="hz" class="hz">0.0 Hz</div>
              <div id="cents" class="cents">listening…</div>
            </div>
          </div>
          <div class="meter" aria-hidden="true">
            <div class="ticks"></div>
            <div class="zone"></div>
            <div class="needle" id="needle"></div>
          </div>
          <div class="spec-head">
            <span>Spectrum</span>
            <div class="seg" id="view">
              <button data-v="full" class="on">Full</button><button data-v="focus">Focus</button>
            </div>
          </div>
          <div class="spectrum"><canvas id="spectrum"></canvas></div>
        </section>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
  <script src="register-sw.js"></script>
</body>
</html>
