<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>tunIN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">tun<b>IN</b></div>
      <button id="start" class="start">Start listening</button>
    </header>

    <nav class="instruments" id="instruments" aria-label="Instrument"></nav>

    <!-- 1. the strings -->
    <section class="neck" id="strings" aria-label="Guitar strings"></section>

    <!-- 2. tuning presets -->
    <section class="tunings" id="tunings" aria-label="Tuning presets"></section>

    <!-- 3. one button per string -->
    <section class="string-buttons" id="buttons" aria-label="Choose string"></section>

    <!-- 4. frequency UI -->
    <section class="freq">
      <div class="readout">
        <div class="note" id="note">–</div>
        <div class="detail">
          <div id="hz" class="hz">0.0 Hz</div>
          <div id="cents" class="cents">listening…</div>
        </div>
      </div>
      <div class="meter" aria-hidden="true">
        <div class="ticks"></div>
        <div class="zone"></div>
        <div class="needle" id="needle"></div>
      </div>
      <div class="spec-head">
        <span>Spectrum</span>
        <div class="seg" id="view">
          <button data-v="full" class="on">Full</button><button data-v="focus">Focus</button>
        </div>
      </div>
      <div class="spectrum"><canvas id="spectrum"></canvas></div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="register-sw.js"></script>
</body>
</html>
